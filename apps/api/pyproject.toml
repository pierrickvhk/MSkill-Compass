[project]
name = "mskill-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "pydantic", "uvicorn"]

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
