name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
  api:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy mskill_api tests
      - run: uv run --frozen pytest
  smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
  production-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker compose -p mskill-beta-check -f docker-compose.production.yml up --build --wait --wait-timeout 180
      - run: API_URL=http://localhost:8002 WEB_URL=http://localhost:3002 node scripts/smoke.mjs
      - name: Container logs
        if: failure()
        run: docker compose -p mskill-beta-check -f docker-compose.production.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -p mskill-beta-check -f docker-compose.production.yml down
